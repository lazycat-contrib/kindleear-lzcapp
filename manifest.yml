lzc-sdk-version: "0.1"
name: KindleEar
package: cloud.lazycat.app.kindleear
version: 3.4.1
description: Aggregates RSS and web content(Calibre recipe), sends to Kindle, and includes an e-ink optimized online reader.
homepage: https://github.com/cdhigh/KindleEar
author: cdhigh
application:
  subdomain: kindleear
  background_task: true
  public_path:
    - /
  routes:
    - /=http://kindleear:8000/
services:
  kindleear:
    image: docker.1ms.run/kindleear/kindleear:3.4.1
    environment:
      - APP_ID=kindleear
      - APP_DOMAIN=https://${LAZYCAT_APP_DOMAIN}
      - TZ=Etc/GMT+8
    binds:
      - /lzcapp/var/data:/data
