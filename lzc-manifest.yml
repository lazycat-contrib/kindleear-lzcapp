application:
  subdomain: kindleear
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://kindleear:8000/
services:
  kindleear:
    # upstream: kindleear/kindleear:3.5.3
    image: registry.lazycat.cloud/czyt/kindleear/kindleear:e9d5a3a5fea3d8a1
    environment:
      - APP_ID=kindleear
      - APP_DOMAIN=https://${LAZYCAT_APP_DOMAIN}
      - TZ=Etc/GMT+8
    binds:
      - /lzcapp/var/data:/data
