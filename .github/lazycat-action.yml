version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/kindleear.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: kindleear

build:
  run_buildscript: false

images:
  - id: kindleear
    target: service
    service: kindleear
    source: kindleear/kindleear
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: KindleEar
    summary: "RSS/网页订阅推送至 Kindle，含墨水屏优化在线阅读器"
